AWSTemplateFormatVersion: "2010-09-09"
Description: Compliant S3 bucket - encrypted, versioned, no public access, TLS-only

Parameters:
  BucketNameSuffix:
    Type: String
    Description: Suffix to make the bucket name unique
    Default: "default"

Resources:
  CompliantBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "favstar-compliant-${BucketNameSuffix}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CompliantBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${CompliantBucket}"
              - !Sub "arn:aws:s3:::${CompliantBucket}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

Outputs:
  BucketName:
    Value: !Ref CompliantBucket
